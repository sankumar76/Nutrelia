{% extends "base.html" %}
{% block content %}
<p class="muted">Opening today… <a id="go" href="{{ url_for('day_view', day='today') }}">Continue</a></p>
<script>
  var d = new Date(), p = function (n) { return String(n).padStart(2, '0'); };
  var day = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  location.replace('{{ url_for('day_view', day='') }}' + day);
</script>
{% endblock %}
