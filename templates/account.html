{% extends "base.html" %}
{% block content %}
<section class="card narrow">
  <h1>{{ user.name }}</h1>
  <p class="muted">Signed in as <b>{{ user.username }}</b>{% if user.is_admin %} (admin){% endif %}.</p>
  <form method="post">
    <h2>Change password</h2>
    <label>Current password <input type="password" name="current" autocomplete="current-password" required></label>
    <label>New password <input type="password" name="new" autocomplete="new-password" minlength="6" required></label>
    <label>New password again <input type="password" name="again" autocomplete="new-password" minlength="6" required></label>
    <button>Change password</button>
  </form>
  <p><a class="button secondary" href="{{ url_for('logout') }}">Log out</a></p>
</section>
{% endblock %}
