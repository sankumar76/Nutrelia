<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BiteLedger{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ url_for('index') }}">BiteLedger</a>
    <nav>
      <a href="{{ url_for('index') }}">Today</a>
      <a href="{{ url_for('foods') }}">Foods</a>
      {% if auth_enabled and session.ok %}<a href="{{ url_for('logout') }}">Log out</a>{% endif %}
    </nav>
  </header>
  <main>
    {% with msgs = get_flashed_messages() %}
      {% for m in msgs %}<p class="flash">{{ m }}</p>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
